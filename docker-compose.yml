services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servimotos_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - servimotos_net
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: servimotos_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - servimotos_net
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: servimotos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: servimotos_fruna
      POSTGRES_USER: servimotos_user
      POSTGRES_PASSWORD: secret_change_in_prod
    ports:
      - "5433:5432"
    volumes:
      - servimotos_pg_data:/var/lib/postgresql/data
    networks:
      - servimotos_net

  redis:
    image: redis:7-alpine
    container_name: servimotos_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - servimotos_net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servimotos_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --backoff=5
    volumes:
      - ./:/var/www
    networks:
      - servimotos_net
    depends_on:
      - app
      - redis

networks:
  servimotos_net:
    driver: bridge

volumes:
  servimotos_pg_data:
